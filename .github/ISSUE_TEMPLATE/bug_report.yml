name: Bug Report
description: Something isn't working as expected
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below as completely as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. 
        2. 
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Mongo Studio git version
      description: Found under Settings > About MongoStudio
      placeholder: d094d20 @ v1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: mongo-version
    attributes:
      label: MongoDB server version (if relevant)
      description: Versions older than 8.0 may not be supported.
      placeholder: e.g. 8.0, or Atlas
    validations:
      required: false

  - type: dropdown
    id: connection-type
    attributes:
      label: Connection type (if relevant)
      options:
        - Standard
        - SSH tunnel
        - Replica set
        - Not applicable
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant error messages, log output, or screenshots. This will be automatically formatted as code.
      render: shell
    validations:
      required: false