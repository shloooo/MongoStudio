name: Build
on:
  push:
    branches: ["nightly", "release"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  macOS-Build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installing Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install deps
        run: |
          npm i -g yarn
          yarn --network-timeout 1000000

      - name: Generate git details
        run: yarn generate:gitinfo

      - name: Build renderer
        run: yarn build:renderer

      - name: Build, sign packages
        run: yarn electron-builder --mac --publish onTag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false

      - name: Package artifacts
        run: |
          mkdir artifact-dmg
          mv release/*.dmg artifact-dmg/
          mkdir artifact-zip
          mv release/*.zip artifact-zip/

      - uses: actions/upload-artifact@v5
        name: Upload DMG
        with:
          name: macOS-dmg
          path: artifact-dmg

      - uses: actions/upload-artifact@v5
        name: Upload ZIP
        with:
          name: macOS-zip
          path: artifact-zip

  Windows-Build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installing Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install npm modules
        shell: powershell
        run: |
          npm i -g yarn
          yarn --network-timeout 1000000

      - name: Generate git details
        run: yarn generate:gitinfo

      - name: Build renderer
        run: yarn build:renderer

      - name: Build packages
        shell: powershell
        run: yarn electron-builder --win --publish onTag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          USE_HARD_LINKS: false

      - uses: actions/upload-artifact@v5
        name: Upload installer/portable
        with:
          name: Windows-build
          path: |
            release/*.exe
            release/*.zip


  Linux-Build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installing Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libsecret-1-dev

      - name: Install npm modules
        run: |
          npm i -g yarn
          yarn --network-timeout 1000000

      - name: Generate git details
        run: yarn generate:gitinfo

      - name: Build renderer
        run: yarn build:renderer

      - name: Build packages
        run: yarn electron-builder --linux --publish onTag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false

      - uses: actions/upload-artifact@v5
        name: Upload AppImage
        with:
          name: Linux-AppImage
          path: release/*.AppImage

      - uses: actions/upload-artifact@v5
        name: Upload DEB
        with:
          name: Linux-DEB
          path: release/*.deb

      - uses: actions/upload-artifact@v5
        name: Upload tarball
        with:
          name: Linux-tarball
          path: release/*.tar.gz