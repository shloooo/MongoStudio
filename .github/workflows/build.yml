name: Build
on:
  push:
    branches: ["release"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      APP_VERSION: ${{ steps.calc.outputs.APP_VERSION }}
      CHANNEL: ${{ steps.calc.outputs.CHANNEL }}
      TAG_NAME: ${{ steps.calc.outputs.TAG_NAME }}
      IS_PRERELEASE: ${{ steps.calc.outputs.IS_PRERELEASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calc
        uses: actions/github-script@v7
        with:
          script: |
            const pkg = require('./package.json');
            const base = pkg.version.split('-')[0].replace(/^v/, '');
            const ref = context.ref;

            let ver = pkg.version;
            let channel = 'latest';
            let isPrerelease = false;

            if (ref.startsWith('refs/heads/')) {
              const rawBranch = ref.replace('refs/heads/', '');
              const cleanBranch = rawBranch.toLowerCase().replace(/[^a-z0-9-]/g, '-');
              isPrerelease = true;

              if (cleanBranch === 'release') {
                ver = base;
                channel = 'latest';
              } else {
                channel = (cleanBranch === 'dev') ? 'canary' : cleanBranch;
                ver = `${base}-${channel}.${context.runNumber}`;
              }
            } else if (ref.startsWith('refs/tags/')) {
              ver = ref.replace('refs/tags/v', '').replace('refs/tags/', '');
              channel = 'latest';
              isPrerelease = false;
            }

            const cleanVer = ver.replace(/^v/, '');
            const tagName = `v${cleanVer}`;

            core.setOutput('APP_VERSION', cleanVer);
            core.setOutput('CHANNEL', channel);
            core.setOutput('TAG_NAME', tagName);
            core.setOutput('IS_PRERELEASE', isPrerelease ? 'true' : 'false');

      - name: Create Tag & Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.calc.outputs.TAG_NAME }}
          IS_PRERELEASE: ${{ steps.calc.outputs.IS_PRERELEASE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" || true
          git push origin "$TAG_NAME" || true

          FLAGS="--draft"
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS="$FLAGS --prerelease"
          fi

          gh release create "$TAG_NAME" $FLAGS --title "$TAG_NAME" --notes "Release $TAG_NAME" || true

  macOS-Build:
    needs: create-release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installing Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install deps
        run: |
          npm i -g yarn
          yarn --network-timeout 1000000

      - name: Generate git details
        run: yarn generate:gitinfo

      - name: Build renderer
        run: yarn build:renderer

      - name: Build packages
        run: yarn electron-builder --mac --publish never -c.extraMetadata.version="${{ needs.create-release.outputs.APP_VERSION }}" -c.publish.channel="${{ needs.create-release.outputs.CHANNEL }}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.TAG_NAME }}
          CHANNEL: ${{ needs.create-release.outputs.CHANNEL }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG_NAME" release/*.dmg release/*.zip release/*.blockmap release/"$CHANNEL"*.yml --clobber

      - name: Package artifacts
        run: |
          mkdir artifact-dmg
          mv release/*.dmg artifact-dmg/
          mkdir artifact-zip
          mv release/*.zip artifact-zip/

      - uses: actions/upload-artifact@v5
        name: Upload DMG
        with:
          name: macOS-dmg
          path: artifact-dmg

      - uses: actions/upload-artifact@v5
        name: Upload ZIP
        with:
          name: macOS-zip
          path: artifact-zip

  Windows-Build:
    needs: create-release
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installing Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install npm modules
        shell: powershell
        run: |
          npm i -g yarn
          yarn --network-timeout 1000000

      - name: Generate git details
        run: yarn generate:gitinfo

      - name: Build renderer
        run: yarn build:renderer

      - name: Build packages
        shell: bash
        run: yarn electron-builder --win nsis --publish never -c.extraMetadata.version="${{ needs.create-release.outputs.APP_VERSION }}" -c.publish.channel="${{ needs.create-release.outputs.CHANNEL }}"
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          USE_HARD_LINKS: false

      - name: Upload to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.TAG_NAME }}
          CHANNEL: ${{ needs.create-release.outputs.CHANNEL }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG_NAME" release/*.exe release/*.blockmap release/"$CHANNEL"*.yml --clobber

      - uses: actions/upload-artifact@v5
        name: Upload installer
        with:
          name: Windows-build
          path: release/*.exe

  Linux-Build:
    needs: create-release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installing Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libsecret-1-dev

      - name: Install npm modules
        run: |
          npm i -g yarn
          yarn --network-timeout 1000000

      - name: Generate git details
        run: yarn generate:gitinfo

      - name: Build renderer
        run: yarn build:renderer

      - name: Build packages
        run: yarn electron-builder --linux --publish never -c.extraMetadata.version="${{ needs.create-release.outputs.APP_VERSION }}" -c.publish.channel="${{ needs.create-release.outputs.CHANNEL }}"
        env:
          USE_HARD_LINKS: false

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.TAG_NAME }}
          CHANNEL: ${{ needs.create-release.outputs.CHANNEL }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG_NAME" release/*.AppImage release/*.deb release/*.tar.gz release/*.blockmap release/"$CHANNEL"*.yml --clobber

      - uses: actions/upload-artifact@v5
        name: Upload AppImage
        with:
          name: Linux-AppImage
          path: release/*.AppImage

      - uses: actions/upload-artifact@v5
        name: Upload DEB
        with:
          name: Linux-DEB
          path: release/*.deb

      - uses: actions/upload-artifact@v5
        name: Upload tarball
        with:
          name: Linux-tarball
          path: release/*.tar.gz