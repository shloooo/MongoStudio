name: Build
on:
  push:
    branches: ["release"]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      APP_VERSION: ${{ steps.calc.outputs.APP_VERSION }}
      CHANNEL: ${{ steps.calc.outputs.CHANNEL }}
      TAG_NAME: ${{ steps.calc.outputs.TAG_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Calculate version
        id: calc
        uses: actions/github-script@v7
        with:
          script: |
            const pkg = require('./package.json');
            const base = pkg.version.split('-')[0];
            const ref = context.ref;

            let ver = pkg.version;
            let channel = 'latest';

            if (ref.startsWith('refs/heads/')) {
              const rawBranch = ref.replace('refs/heads/', '');
              const cleanBranch = rawBranch.toLowerCase().replace(/[^a-z0-9-]/g, '-');
              channel = (cleanBranch === 'dev') ? 'canary' : cleanBranch;
              ver = `${base}-${channel}.${context.runNumber}`;
            } else if (ref.startsWith('refs/tags/')) {
              ver = ref.replace('refs/tags/v', '').replace('refs/tags/', '');
              channel = 'latest';
            }

            const tagName = ver.startsWith('v') ? ver : `v${ver}`;

            core.setOutput('APP_VERSION', ver);
            core.setOutput('CHANNEL', channel);
            core.setOutput('TAG_NAME', tagName);

      - name: Create Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.calc.outputs.TAG_NAME }}
        run: |
          gh release create "$TAG_NAME" --draft --title "$TAG_NAME" --notes "Release $TAG_NAME" || true

  macOS-Build:
    needs: create-release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installing Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install deps
        run: |
          npm i -g yarn
          yarn --network-timeout 1000000

      - name: Generate git details
        run: yarn generate:gitinfo

      - name: Build renderer
        run: yarn build:renderer

      - name: Build packages
        run: yarn electron-builder --mac -c.extraMetadata.version="${{ needs.create-release.outputs.APP_VERSION }}" -c.publish.channel="${{ needs.create-release.outputs.CHANNEL }}"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.TAG_NAME }}
        run: |
          gh release upload "$TAG_NAME" release/*.dmg release/*.zip --clobber

      - uses: actions/upload-artifact@v5
        name: Upload DMG
        with:
          name: macOS-dmg
          path: release/*.dmg

      - uses: actions/upload-artifact@v5
        name: Upload ZIP
        with:
          name: macOS-zip
          path: release/*.zip

  Windows-Build:
    needs: create-release
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installing Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install npm modules
        shell: powershell
        run: |
          npm i -g yarn
          yarn --network-timeout 1000000

      - name: Generate git details
        run: yarn generate:gitinfo

      - name: Build renderer
        run: yarn build:renderer

      - name: Build packages
        shell: bash
        run: yarn electron-builder --win -c.extraMetadata.version="${{ needs.create-release.outputs.APP_VERSION }}" -c.publish.channel="${{ needs.create-release.outputs.CHANNEL }}"
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          USE_HARD_LINKS: false

      - name: Upload to Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.TAG_NAME }}
        run: |
          gh release upload "$TAG_NAME" release/*.exe release/*.zip --clobber

      - uses: actions/upload-artifact@v5
        name: Upload installer/portable
        with:
          name: Windows-build
          path: |
            release/*.exe
            release/*.zip

  Linux-Build:
    needs: create-release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Installing Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libsecret-1-dev

      - name: Install npm modules
        run: |
          npm i -g yarn
          yarn --network-timeout 1000000

      - name: Generate git details
        run: yarn generate:gitinfo

      - name: Build renderer
        run: yarn build:renderer

      - name: Build packages
        run: yarn electron-builder --linux -c.extraMetadata.version="${{ needs.create-release.outputs.APP_VERSION }}" -c.publish.channel="${{ needs.create-release.outputs.CHANNEL }}"
        env:
          USE_HARD_LINKS: false

      - name: Upload to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.create-release.outputs.TAG_NAME }}
        run: |
          gh release upload "$TAG_NAME" release/*.AppImage release/*.deb release/*.tar.gz --clobber

      - uses: actions/upload-artifact@v5
        name: Upload AppImage
        with:
          name: Linux-AppImage
          path: release/*.AppImage

      - uses: actions/upload-artifact@v5
        name: Upload DEB
        with:
          name: Linux-DEB
          path: release/*.deb

      - uses: actions/upload-artifact@v5
        name: Upload tarball
        with:
          name: Linux-tarball
          path: release/*.tar.gz